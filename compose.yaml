# Car Scratch development, test and simulator stack (everything runs in containers).
#   docker compose run --rm server-test          # fast Python tests
#   docker compose run --rm editor-test          # scratch-vm Tap + scratch-gui Jest tests for our code
#   docker compose up -d sim-server              # http://localhost:18080 (needs out/www from the editor build)
#   docker compose run --rm e2e                  # Playwright against sim-server
#   docker compose run --rm deploy               # deploy.sh --dry-run; real deploy: ... deploy sh deploy/deploy.sh
name: car-scratch
services:
  server-test:
    build: {context: ., dockerfile: docker/server.Dockerfile, target: test}
    volumes: ["./server:/app/server:ro"]
    working_dir: /app/server
    command: ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider", "tests"]

  sim-server:
    build: {context: ., dockerfile: docker/server.Dockerfile, target: base}
    volumes:
      - "./server:/app/server:ro"
      - "./out/www:/www:ro"
      - "./out/examples:/examples:ro"
      - "./out/source:/source:ro"
    command: ["python3", "-m", "picar_server", "--port", "8080", "--hardware", "sim",
              "--www", "/www", "--examples", "/examples", "--source", "/source",
              "--data", "/tmp/car-scratch-data", "--config", "/tmp/car-scratch-config",
              "--allow-host", "sim-server"]
    ports: ["18080:8080"]   # host port 8080 is reserved on the Windows workstation
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/status"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Prebuilt deps + sibling packages; our source folders are bind-mounted so edits need no image rebuild.
  #   docker compose run --rm editor-test                       # all Car Scratch editor tests
  #   docker compose run --rm editor-test sh -c "cd packages/scratch-vm && npx tap test/unit/extension_picar.js"
  editor-test:
    build: {context: ., dockerfile: docker/editor.Dockerfile, target: test}
    image: car-scratch-editor-test
    volumes:
      - "./editor/packages/scratch-vm/src:/src/editor/packages/scratch-vm/src"
      - "./editor/packages/scratch-vm/test:/src/editor/packages/scratch-vm/test"
      - "./editor/packages/scratch-gui/src:/src/editor/packages/scratch-gui/src"
      - "./editor/packages/scratch-gui/test:/src/editor/packages/scratch-gui/test"
      - "./examples:/src/examples"
      - "./out/examples:/src/out-examples:ro"
    command: ["sh", "-c", "cd packages/scratch-vm && npx tap test/unit/extension_picar*.js && cd ../scratch-gui && npx jest test/unit/picar"]

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    depends_on:
      sim-server: {condition: service_healthy}
    volumes: ["./e2e:/e2e", "./out/e2e:/out"]
    working_dir: /e2e
    environment:
      BASE_URL: http://sim-server:8080
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test --output=/out/test-results"]

  # Deploy to the Pi (ssh key dir: PICAR_SSH_DIR, default ~/.ssh). Default command is a dry run, no ssh.
  deploy:
    profiles: ["deploy"]
    build: {context: ., dockerfile: docker/deploy.Dockerfile}
    volumes:
      - ".:/repo:ro"
      - "./out:/repo/out"
      - "${PICAR_SSH_DIR:-${USERPROFILE:-${HOME}}/.ssh}:/ssh-src:ro"
    working_dir: /repo
    environment:
      PICAR_HOST: ${PICAR_HOST:-192.168.0.209}
